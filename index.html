<!doctype html>
<html lang="ru" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Деловой корейский · За столом переговоров (RU → KO/EN)</title>
<meta name="description" content="Деловой корейский · За столом переговоров: карточки, диалоги, тесты, глоссарий, график отгрузок, классификация и таймлайн сроков. Русский → корейский/английский. Работает офлайн.">
<meta name="color-scheme" content="dark light">
<!-- Тёмная тема по умолчанию; если пользователь уже выбирал — берём из localStorage -->
<script>
try {
  if (localStorage.getItem('negot-theme') === 'light') {
    document.documentElement.classList.remove('dark');
  }
} catch (e) { /* приватный режим — остаёмся в тёмной теме */ }
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header class="site">
    <div class="head-inner">
      <div class="brand">
        <span class="logo" aria-hidden="true"></span>
        <div class="titles">
          <h1 class="site">Деловой корейский · За столом переговоров</h1>
          <p class="subtitle">Русский → 한국어 / English · карточки, диалоги, тесты · офлайн</p>
        </div>
      </div>
      <div class="controls">
        <!-- Переключатель целевого языка карточек -->
        <div class="lang-switch" role="group" aria-label="Язык карточек">
          <button type="button" data-action="lang" data-lang="ko" title="Корейские карточки">KO</button>
          <button type="button" data-action="lang" data-lang="en" title="Английские карточки">EN</button>
        </div>
        <!-- Размер шрифта -->
        <div class="font-step" role="group" aria-label="Размер шрифта">
          <button type="button" data-action="font-dec" aria-label="Уменьшить шрифт">&minus;</button>
          <span class="val" id="fontVal">100%</span>
          <button type="button" data-action="font-inc" aria-label="Увеличить шрифт">+</button>
        </div>
        <!-- Тема -->
        <button type="button" class="icon-btn" id="themeBtn" data-action="theme" aria-label="Переключить тему">
          <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main">
    <!-- Содержимое экранов рисует app.js -->
    <div id="screen" class="screen" aria-live="polite"></div>
  </main>

  <footer class="site">
    <div class="foot-inner">
      <span>Объединяет три тренажёра: Фольга · ХанДело · Закупки</span>
      <span id="footStats">Прогресс хранится в этом браузере</span>
    </div>
  </footer>
</div>

<!-- Область печати карточек -->
<div id="printArea" aria-hidden="true"></div>

<!-- Оверлей: ошибки загрузки данных / подтверждения -->
<div id="overlay" class="overlay" hidden>
  <div class="panel" id="overlayPanel"></div>
</div>

<noscript>
  <p style="text-align:center;padding:1rem">Для работы тренажёра включите JavaScript.</p>
</noscript>

<!-- Единый источник данных: правьте карточки в data.js (работает двойным кликом, без сервера) -->
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
